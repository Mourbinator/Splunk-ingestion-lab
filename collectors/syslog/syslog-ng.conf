@version: 3.38
options { chain_hostnames(no); flush_lines(1); use_dns(no); use_fqdn(no); };
source s_lab { network(ip("0.0.0.0") port(5514) transport("udp")); };
destination d_file { file("/var/log/soc-lab/firewall.log" create_dirs(yes) owner("root") group("adm") perm(0640)); };
log { source(s_lab); destination(d_file); flags(flow-control); };
